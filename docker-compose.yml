services:
  # Backend (Go) — o proxy/túnel roteia /api/* direto pra cá
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    expose:
      - "8088"
    ports:
      - "8088:8088"
    environment:
      - PORT=8088
      - DATABASE_URL=postgres://${DB_USER:?defina DB_USER no Coolify}:${DB_PASSWORD:?defina DB_PASSWORD no Coolify}@db:5432/${DB_NAME:-fb_auditoria}?sslmode=disable
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - APP_URL=${APP_URL:-https://auditoria.fbtax.cloud}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://auditoria.fbtax.cloud}
      - JC_ORACLE_HOST=${JC_ORACLE_HOST:-201.48.119.197}
      - JC_ORACLE_PORT=${JC_ORACLE_PORT:-1521}
      - JC_ORACLE_SERVICE=${JC_ORACLE_SERVICE:-cdb1}
      - JC_ORACLE_USER=${JC_ORACLE_USER}
      - JC_ORACLE_PASS=${JC_ORACLE_PASS}
      - JC_EMPRESA_ID=${JC_EMPRESA_ID:-}
      - JC_ORACLE_DRE_VIEWS=${JC_ORACLE_DRE_VIEWS:-VW_DRE_CONSOLIDADO,VW_DRE_ORCAMENTO}
    depends_on:
      db:
        condition: service_healthy
    networks:
      # Alias único evita colisão de DNS entre stacks Coolify (mesmo padrão do Farol).
      fb_net:
        aliases:
          - auditoria-api
      coolify: {}

  # Frontend (React/Nginx)
  web:
    build:
      context: ./frontend
    restart: always
    expose:
      - "80"
    depends_on:
      - api
    networks:
      - fb_net
      - coolify

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:?defina DB_USER no Coolify}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?defina DB_PASSWORD no Coolify}
      - POSTGRES_DB=${DB_NAME:-fb_auditoria}
    volumes:
      - auditoria_pg_data:/var/lib/postgresql/data
    networks:
      - fb_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?defina DB_USER no Coolify} -d ${DB_NAME:-fb_auditoria}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  fb_net:
    driver: bridge
  coolify:
    external: true

volumes:
  auditoria_pg_data:
